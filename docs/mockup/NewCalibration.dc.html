<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tacca — Nuova calibrazione</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,'Helvetica Neue',sans-serif;background:#F6F0E8;color:#2A1C13}
a{color:#2A1C13}a:hover{color:#B4552E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F0E8; color: #2A1C13; font-family: Figtree, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 52px 20px 24px 20px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Nuova calibrazione</h1>
    <a href="Main.dc.html" aria-label="Chiudi" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid #EADFD3; background: #FFFCF8; display: flex; align-items: center; justify-content: center; color: #2A1C13">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </div>

  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
    <legend style="padding: 0 0 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6F5B4C">Caffè</legend>
    <sc-for list="{{coffees}}" as="c" hint-placeholder-count="3">
      <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 48px; padding: 10px 14px; border-radius: 16px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 14px; font-weight: 600; color: #2A1C13; cursor: pointer; border: 1.5px solid {{c.border}}; background: {{c.bg}}">
        <span style="width: 18px; height: 18px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; border: 5px solid {{c.dot}}; background: #FFFCF8"></span>
        <span>{{c.name}}</span>
      </button>
    </sc-for>
  </fieldset>

  <fieldset style="border: 0; margin: 0; padding: 0">
    <legend style="padding: 0 0 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6F5B4C">Metodo</legend>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{methods}}" as="m" hint-placeholder-count="5">
        <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 78px; padding: 8px 2px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 700; line-height: 1.1; color: #2A1C13; cursor: pointer; border: 1.5px solid {{m.border}}; background: {{m.bg}}">
          <sc-if value="{{m.isMoka}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l-2 8H9z"/><path d="M9 13h6l2 8H7z"/><path d="M8.5 12h7"/><path d="M17 5c2.5 0 3 4 .5 5"/></svg></sc-if>
          <sc-if value="{{m.isEspresso}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M3 21h16"/><path d="M9 3v3M12.5 3v3"/></svg></sc-if>
          <sc-if value="{{m.isFrench}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h10v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M5 8h12"/><path d="M11 3v9"/><path d="M9 3h4"/><path d="M6 12h10"/><path d="M16 11h2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-2"/></svg></sc-if>
          <sc-if value="{{m.isV60}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M5 6l4.5 9h5L19 6"/><path d="M10 15v3M14 15v3"/><path d="M7 18h10"/><path d="M8 21h8"/></svg></sc-if>
          <sc-if value="{{m.isAero}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v15H8z"/><path d="M6 3h12"/><path d="M8 8h8"/><path d="M6 21h12"/><path d="M10 18v3M14 18v3"/></svg></sc-if>
          <span>{{m.label}}</span>
        </button>
      </sc-for>
    </div>
  </fieldset>

  <fieldset style="border: 0; margin: 0; padding: 0">
    <legend style="padding: 0 0 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6F5B4C">Macina</legend>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{grinders}}" as="g" hint-placeholder-count="2">
        <button onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="min-height: 56px; padding: 8px 12px; border-radius: 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; color: #2A1C13; cursor: pointer; border: 1.5px solid {{g.border}}; background: {{g.bg}}">
          <span style="font-size: 14px; font-weight: 700">{{g.name}}</span>
          <span style="font-size: 12px; font-weight: 500; color: #6F5B4C">{{g.kindLabel}}</span>
        </button>
      </sc-for>
    </div>
  </fieldset>

  <fieldset style="border: 0; margin: 0; padding: 0">
    <legend style="padding: 0 0 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6F5B4C">Regolazione</legend>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFCF8; border: 1px solid #EADFD3; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 112px; box-sizing: border-box">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 14px; font-weight: 700">Giri</span>
          <span style="font-size: 11px; font-weight: 600; color: #6F5B4C">opzionale</span>
        </div>
        <sc-if value="{{multi}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <button onClick="{{turnsDown}}" aria-label="Meno giri" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F6F0E8; color: #2A1C13; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
            <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1">{{turns}}</span>
            <button onClick="{{turnsUp}}" aria-label="Più giri" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F6F0E8; color: #2A1C13; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
          </div>
        </sc-if>
        <sc-if value="{{single}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 13px; line-height: 1.35; color: #6F5B4C">Questa macina si regola entro un solo giro: bastano gli step.</p>
        </sc-if>
      </div>
      <div style="background: #FFFCF8; border: 1.5px solid {{accent}}; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 112px; box-sizing: border-box">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 14px; font-weight: 700">Step</span>
          <span style="font-size: 11px; font-weight: 600; color: #6F5B4C">{{stepHint}}</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <button onClick="{{stepsDown}}" aria-label="Meno step" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F6F0E8; color: #2A1C13; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
          <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1; color: {{accent}}">{{steps}}</span>
          <button onClick="{{stepsUp}}" aria-label="Più step" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F6F0E8; color: #2A1C13; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
        </div>
      </div>
    </div>
  </fieldset>

  <div style="flex-grow: 1"></div>

  <a href="Detail.dc.html" style="height: 56px; border-radius: 20px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 700; box-shadow: 0 12px 24px -12px rgba(90,40,15,0.55)">
    <span>Salva</span>
    <span style="opacity: 0.85; font-weight: 600">· {{summary}}</span>
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4552E","options":["#B4552E","#2F6B5A","#3D5A8A","#8A4B6E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { coffee: 0, method: 'v60', grinder: 0, turns: 2, steps: 12 };
  }
  renderVals() {
    var accent = this.props.accent ?? '#B4552E';
    var s = this.state, self = this;
    var tints = { moka: '#F7DCCB', espresso: '#F2E4BC', french: '#DCE6D1', v60: '#D7E3EE', aero: '#E6DDEE' };
    var grinderData = [
      { name: '1Zpresso JX-Pro', multi: true, perTurn: 40 },
      { name: 'Baratza Encore ESP', multi: false, perTurn: 40 }
    ];
    var g = grinderData[s.grinder];
    var coffees = ['Etiopia Yirgacheffe Kochere — lavato', 'Brasile Cerrado Mineiro — naturale', 'Miscela Casa 70/30 Arabica e Robusta'].map(function (name, i) {
      var on = i === s.coffee;
      return { name: name, on: on, border: on ? accent : '#EADFD3', bg: '#FFFCF8', dot: on ? accent : '#E3D6C8',
        pick: function () { self.setState({ coffee: i }); } };
    });
    var methods = [
      { id: 'moka', label: 'Moka' }, { id: 'espresso', label: 'Espresso' }, { id: 'v60', label: 'V60' },
      { id: 'french', label: 'French press' }, { id: 'aero', label: 'AeroPress' }
    ].map(function (m) {
      var on = m.id === s.method;
      return { label: m.label, on: on, border: on ? '#2A1C13' : 'transparent', bg: tints[m.id],
        isMoka: m.id === 'moka', isEspresso: m.id === 'espresso', isFrench: m.id === 'french', isV60: m.id === 'v60', isAero: m.id === 'aero',
        pick: function () { self.setState({ method: m.id }); } };
    });
    var grinders = grinderData.map(function (x, i) {
      var on = i === s.grinder;
      return { name: x.name, kindLabel: x.multi ? 'Multi-giro · ' + x.perTurn + '/giro' : 'Giro singolo · ' + x.perTurn + ' step',
        on: on, border: on ? '#2A1C13' : '#EADFD3', bg: '#FFFCF8',
        pick: function () { self.setState({ grinder: i }); } };
    });
    var max = g.perTurn - 1;
    var steps = Math.min(s.steps, g.multi ? max : g.perTurn);
    var summary = g.multi && s.turns > 0 ? s.turns + ' giri + ' + steps + ' step' : steps + ' step';
    return {
      accent: accent, coffees: coffees, methods: methods, grinders: grinders,
      multi: g.multi, single: !g.multi,
      turns: s.turns, steps: steps, summary: summary,
      stepHint: g.multi ? '0–' + max + ' dopo i giri' : '0–' + g.perTurn,
      turnsDown: function () { self.setState({ turns: Math.max(0, s.turns - 1) }); },
      turnsUp: function () { self.setState({ turns: s.turns + 1 }); },
      stepsDown: function () { self.setState({ steps: Math.max(0, steps - 1) }); },
      stepsUp: function () { self.setState({ steps: Math.min(g.multi ? max : g.perTurn, steps + 1) }); }
    };
  }
}
</script>
</body>
</html>
