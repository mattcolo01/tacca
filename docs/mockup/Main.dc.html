<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tacca — Calibrazioni</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,'Helvetica Neue',sans-serif;background:#F6F0E8;color:#2A1C13}
a{color:#2A1C13}a:hover{color:#B4552E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F0E8; color: #2A1C13; font-family: Figtree, 'Helvetica Neue', sans-serif">

<div style="display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 0 20px">
  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 6px; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 15px; color: {{accent}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V7"/></svg>
        <span>tacca</span>
      </div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em">Calibrazioni</h1>
    </div>
    <button aria-label="Cerca" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid #EADFD3; background: #FFFCF8; color: #2A1C13; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>
    </button>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button onClick="{{f.pick}}" style="flex-shrink: 0; height: 38px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding-bottom: 120px">
    <sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F5B4C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8.5" transform="rotate(35 12 12)"/><path d="M8.6 17.4c2-2.2 1.6-4.6 3.4-6s3-3.4 3.4-5.8"/></svg>
          <span style="font-size: 15px; font-weight: 700; line-height: 1.25; text-wrap: pretty">{{group.name}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1px; background: #EADFD3; border: 1px solid #EADFD3; border-radius: 22px; overflow: hidden">
          <sc-for list="{{group.rows}}" as="row" hint-placeholder-count="2">
            <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; min-height: 64px; box-sizing: border-box; background: #FFFCF8; text-decoration: none; color: #2A1C13">
              <span style="width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{row.tint}}; color: #2A1C13">
                <sc-if value="{{row.isMoka}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l-2 8H9z"/><path d="M9 13h6l2 8H7z"/><path d="M8.5 12h7"/><path d="M17 5c2.5 0 3 4 .5 5"/></svg></sc-if>
                <sc-if value="{{row.isEspresso}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M3 21h16"/><path d="M9 3v3M12.5 3v3"/></svg></sc-if>
                <sc-if value="{{row.isFrench}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h10v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M5 8h12"/><path d="M11 3v9"/><path d="M9 3h4"/><path d="M6 12h10"/><path d="M16 11h2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-2"/></svg></sc-if>
                <sc-if value="{{row.isV60}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M5 6l4.5 9h5L19 6"/><path d="M10 15v3M14 15v3"/><path d="M7 18h10"/><path d="M8 21h8"/></svg></sc-if>
                <sc-if value="{{row.isAero}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v15H8z"/><path d="M6 3h12"/><path d="M8 8h8"/><path d="M6 21h12"/><path d="M10 18v3M14 18v3"/></svg></sc-if>
              </span>
              <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
                <span style="font-size: 15px; font-weight: 600">{{row.method}}</span>
                <span style="font-size: 13px; color: #6F5B4C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.grinder}}</span>
              </span>
              <span style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
                <sc-if value="{{row.hasTurns}}" hint-placeholder-val="{{ true }}">
                  <span style="display: flex; flex-direction: column; align-items: center; min-width: 26px">
                    <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 24px; font-weight: 700; line-height: 1">{{row.turns}}</span>
                    <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6F5B4C; margin-top: 4px">giri</span>
                  </span>
                  <span style="width: 1px; height: 28px; background: #EADFD3"></span>
                </sc-if>
                <span style="display: flex; flex-direction: column; align-items: center; min-width: 30px">
                  <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 24px; font-weight: 700; line-height: 1; color: {{accent}}">{{row.steps}}</span>
                  <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6F5B4C; margin-top: 4px">step</span>
                </span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>

<a href="NewCalibration.dc.html" aria-label="Nuova calibrazione" style="position: absolute; right: 20px; bottom: 108px; width: 60px; height: 60px; border-radius: 22px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 24px -10px rgba(90,40,15,0.55)">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</a>

<nav aria-label="Sezioni" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 22px 12px; background: #FFFCF8; border-top: 1px solid #EADFD3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
  <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #2A1C13; font-size: 11px; font-weight: 700">
    <span style="width: 52px; height: 30px; border-radius: 999px; background: #F4DCCD; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V6"/><path d="M12 12l3.5-3.5"/></svg></span>
    <span>Calibrazioni</span>
  </a>
  <a href="Coffees.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #6F5B4C; font-size: 11px; font-weight: 600">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8.5" transform="rotate(35 12 12)"/><path d="M8.6 17.4c2-2.2 1.6-4.6 3.4-6s3-3.4 3.4-5.8"/></svg></span>
    <span>Caffè</span>
  </a>
  <a href="Methods.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #6F5B4C; font-size: 11px; font-weight: 600">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4.2 6 7.4 6 11a6 6 0 0 1-12 0c0-3.6 3-6.8 6-11z"/></svg></span>
    <span>Metodi</span>
  </a>
  <a href="Grinders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #6F5B4C; font-size: 11px; font-weight: 600">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 11h8v9a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z"/><path d="M7 11h10"/><path d="M12 11V6h5"/><circle cx="18.5" cy="6" r="1.5"/><path d="M8 15h8"/></svg></span>
    <span>Macine</span>
  </a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4552E","options":["#B4552E","#2F6B5A","#3D5A8A","#8A4B6E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    var accent = this.props.accent ?? '#B4552E';
    var tints = { moka: '#F7DCCB', espresso: '#F2E4BC', french: '#DCE6D1', v60: '#D7E3EE', aero: '#E6DDEE' };
    var data = [
      { name: 'Etiopia Yirgacheffe Kochere — lavato', rows: [
        { kind: 'v60', method: 'V60', grinder: '1Zpresso JX-Pro', turns: 2, steps: 12 },
        { kind: 'aero', method: 'AeroPress', grinder: 'Baratza Encore ESP', turns: null, steps: 16 },
        { kind: 'french', method: 'French press', grinder: '1Zpresso JX-Pro', turns: 3, steps: 5 }
      ]},
      { name: 'Brasile Cerrado Mineiro — naturale', rows: [
        { kind: 'moka', method: 'Moka', grinder: '1Zpresso JX-Pro', turns: 1, steps: 30 },
        { kind: 'espresso', method: 'Espresso', grinder: 'Baratza Encore ESP', turns: null, steps: 8 }
      ]},
      { name: 'Miscela Casa 70/30 Arabica e Robusta', rows: [
        { kind: 'moka', method: 'Moka', grinder: 'Baratza Encore ESP', turns: null, steps: 22 },
        { kind: 'espresso', method: 'Espresso', grinder: '1Zpresso JX-Pro', turns: 1, steps: 4 }
      ]}
    ];
    var f = this.state.filter;
    var groups = data.map(function (g) {
      return {
        name: g.name,
        rows: g.rows.filter(function (r) { return f === 'all' || r.kind === f; }).map(function (r) {
          return Object.assign({}, r, {
            tint: tints[r.kind],
            hasTurns: r.turns != null,
            isMoka: r.kind === 'moka', isEspresso: r.kind === 'espresso', isFrench: r.kind === 'french',
            isV60: r.kind === 'v60', isAero: r.kind === 'aero'
          });
        })
      };
    }).filter(function (g) { return g.rows.length > 0; });
    var self = this;
    var filters = [
      { id: 'all', label: 'Tutti' }, { id: 'moka', label: 'Moka' }, { id: 'espresso', label: 'Espresso' },
      { id: 'v60', label: 'V60' }, { id: 'french', label: 'French press' }, { id: 'aero', label: 'AeroPress' }
    ].map(function (x) {
      var on = x.id === f;
      return {
        label: x.label,
        bg: on ? '#2A1C13' : '#FFFCF8',
        fg: on ? '#FFFCF8' : '#2A1C13',
        border: on ? '#2A1C13' : '#EADFD3',
        pick: function () { self.setState({ filter: x.id }); }
      };
    });
    return { accent: accent, groups: groups, filters: filters };
  }
}
</script>
</body>
</html>
