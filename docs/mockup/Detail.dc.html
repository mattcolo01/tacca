<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tacca — Dettaglio calibrazione</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,'Helvetica Neue',sans-serif;background:#F6F0E8;color:#2A1C13}
a{color:#2A1C13}a:hover{color:#B4552E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F0E8; color: #2A1C13; font-family: Figtree, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 52px 20px 28px 20px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Indietro" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid #EADFD3; background: #FFFCF8; display: flex; align-items: center; justify-content: center; color: #2A1C13">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <a href="NewCalibration.dc.html" style="height: 44px; padding: 0 16px; border-radius: 16px; border: 1px solid #EADFD3; background: #FFFCF8; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #2A1C13; font-size: 14px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      <span>Modifica</span>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; text-wrap: pretty">Etiopia Yirgacheffe Kochere — lavato</h1>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="height: 34px; padding: 0 12px 0 8px; border-radius: 999px; background: #D7E3EE; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M5 6l4.5 9h5L19 6"/><path d="M10 15v3M14 15v3"/><path d="M7 18h10"/><path d="M8 21h8"/></svg>
        <span>V60</span>
      </span>
      <span style="height: 34px; padding: 0 12px 0 8px; border-radius: 999px; background: #FFFCF8; border: 1px solid #EADFD3; box-sizing: border-box; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 11h8v9a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z"/><path d="M7 11h10"/><path d="M12 11V6h5"/><circle cx="18.5" cy="6" r="1.5"/><path d="M8 15h8"/></svg>
        <span>1Zpresso JX-Pro</span>
      </span>
    </div>
  </div>

  <div style="background: #FFFCF8; border: 1px solid #EADFD3; border-radius: 28px; padding: 22px 20px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="position: relative; width: 260px; height: 260px">
      <svg width="260" height="260" viewBox="0 0 260 260" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <sc-for list="{{rings}}" as="ring" hint-placeholder-count="2">
          <circle cx="130" cy="130" r="{{ring.r}}" fill="none" stroke="#F4DCCD" stroke-width="5"></circle>
        </sc-for>
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="40">
          <line x1="{{t.x1}}" y1="{{t.y1}}" x2="{{t.x2}}" y2="{{t.y2}}" stroke="{{t.color}}" stroke-width="{{t.w}}" stroke-linecap="round"></line>
        </sc-for>
        <circle cx="{{pointer.x}}" cy="{{pointer.y}}" r="8" fill="{{accent}}" stroke="#FFFCF8" stroke-width="3"></circle>
      </svg>
      <div style="position: absolute; left: 0; top: 0; width: 260px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 15px; font-weight: 600; color: #6F5B4C">2 giri +</span>
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 76px; line-height: 0.95; letter-spacing: -0.03em; color: {{accent}}">12</span>
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F5B4C">step</span>
      </div>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <li style="background: #F6F0E8; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 13px; color: #6F5B4C">1</span>
        <span style="font-size: 13px; font-weight: 600; line-height: 1.25">Chiudi fino a zero</span>
      </li>
      <li style="background: #F6F0E8; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 13px; color: #6F5B4C">2</span>
        <span style="font-size: 13px; font-weight: 600; line-height: 1.25">Ruota 2 giri completi</span>
      </li>
      <li style="background: #F4DCCD; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 13px; color: #6F5B4C">3</span>
        <span style="font-size: 13px; font-weight: 600; line-height: 1.25">Aggiungi 12 step</span>
      </li>
    </ol>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6F5B4C">Stesso caffè</h2>
    <div style="display: flex; flex-direction: column; gap: 1px; background: #EADFD3; border: 1px solid #EADFD3; border-radius: 22px; overflow: hidden">
      <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; min-height: 56px; box-sizing: border-box; background: #FFFCF8; text-decoration: none; color: #2A1C13">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: #E6DDEE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v15H8z"/><path d="M6 3h12"/><path d="M8 8h8"/><path d="M6 21h12"/><path d="M10 18v3M14 18v3"/></svg></span>
        <span style="flex-grow: 1; font-size: 14px; font-weight: 600">AeroPress · <span style="font-weight: 500; color: #6F5B4C">Encore ESP</span></span>
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 17px">16 step</span>
      </a>
      <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; min-height: 56px; box-sizing: border-box; background: #FFFCF8; text-decoration: none; color: #2A1C13">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: #DCE6D1; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h10v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M5 8h12"/><path d="M11 3v9"/><path d="M9 3h4"/><path d="M6 12h10"/><path d="M16 11h2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-2"/></svg></span>
        <span style="flex-grow: 1; font-size: 14px; font-weight: 600">French press · <span style="font-weight: 500; color: #6F5B4C">JX-Pro</span></span>
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 17px">3 giri + 5</span>
      </a>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4552E","options":["#B4552E","#2F6B5A","#3D5A8A","#8A4B6E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#B4552E';
    var perTurn = 40, steps = 12, turns = 2;
    var ticks = [];
    for (var i = 0; i < perTurn; i++) {
      var a = (i / perTurn) * Math.PI * 2 - Math.PI / 2;
      var major = i % 5 === 0;
      var ro = 118, ri = major ? 102 : 108;
      ticks.push({
        x1: 130 + Math.cos(a) * ri, y1: 130 + Math.sin(a) * ri,
        x2: 130 + Math.cos(a) * ro, y2: 130 + Math.sin(a) * ro,
        color: i <= steps ? accent : '#E3D6C8',
        w: major ? 3 : 2
      });
    }
    var pa = (steps / perTurn) * Math.PI * 2 - Math.PI / 2;
    var rings = [];
    for (var k = 0; k < turns; k++) rings.push({ r: 90 - k * 9 });
    return {
      accent: accent,
      ticks: ticks,
      rings: rings,
      pointer: { x: 130 + Math.cos(pa) * 118, y: 130 + Math.sin(pa) * 118 }
    };
  }
}
</script>
</body>
</html>
